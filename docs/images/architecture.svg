<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" role="img">
<title>CascadeShield architecture: AI agents and blockchain</title>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.h { font-size: 19px; font-weight: 600; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; }
.p rect { fill: #EEEDFE; stroke: #534AB7; } .p .th { fill: #3C3489; } .p .ts { fill: #534AB7; }
.g rect { fill: #E1F5EE; stroke: #0F6E56; } .g .th { fill: #085041; } .g .ts { fill: #0F6E56; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.zone { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 6 4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="770" fill="#FFFFFF"/>
<text class="h" x="340" y="34" text-anchor="middle" dominant-baseline="central">CascadeShield: AI agents + blockchain architecture</text>

<g transform="translate(0,50)">
<rect class="box" x="120" y="30" width="200" height="56" rx="8"/>
<text class="th" x="220" y="50" text-anchor="middle" dominant-baseline="central">Security advisories</text>
<text class="ts" x="220" y="68" text-anchor="middle" dominant-baseline="central">CERT-In, vendor bulletins</text>
<rect class="box" x="360" y="30" width="200" height="56" rx="8"/>
<text class="th" x="460" y="50" text-anchor="middle" dominant-baseline="central">Private asset inventory</text>
<text class="ts" x="460" y="68" text-anchor="middle" dominant-baseline="central">Never leaves the org</text>
<line x1="220" y1="88" x2="220" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="88" x2="460" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect class="zone" x="30" y="130" width="620" height="210" rx="20"/>
<text class="th" x="340" y="154" text-anchor="middle" dominant-baseline="central">AI agent node (one per organisation)</text>
<text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">Power, water and hospital each run their own</text>
<g class="p">
<rect x="50" y="192" width="180" height="56" rx="8"/>
<text class="th" x="140" y="212" text-anchor="middle" dominant-baseline="central">1. Intake agent</text>
<text class="ts" x="140" y="230" text-anchor="middle" dominant-baseline="central">Reads advisories</text>
<rect x="250" y="192" width="180" height="56" rx="8"/>
<text class="th" x="340" y="212" text-anchor="middle" dominant-baseline="central">2. Risk agent</text>
<text class="ts" x="340" y="230" text-anchor="middle" dominant-baseline="central">ML score + why (SHAP)</text>
<rect x="450" y="192" width="180" height="56" rx="8"/>
<text class="th" x="540" y="212" text-anchor="middle" dominant-baseline="central">3. Cascade agent</text>
<text class="ts" x="540" y="230" text-anchor="middle" dominant-baseline="central">Predicts the spread</text>
<rect x="50" y="264" width="180" height="56" rx="8"/>
<text class="th" x="140" y="284" text-anchor="middle" dominant-baseline="central">4. Planner agent</text>
<text class="ts" x="140" y="302" text-anchor="middle" dominant-baseline="central">Builds the fix plan</text>
<rect x="250" y="264" width="180" height="56" rx="8"/>
<text class="th" x="340" y="284" text-anchor="middle" dominant-baseline="central">5. Critic agent</text>
<text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">Checks plan safety</text>
<rect x="450" y="264" width="180" height="56" rx="8"/>
<text class="th" x="540" y="284" text-anchor="middle" dominant-baseline="central">6. Executor agent</text>
<text class="ts" x="540" y="302" text-anchor="middle" dominant-baseline="central">Acts only if approved</text>
</g>

<line x1="280" y1="342" x2="280" y2="398" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="370" text-anchor="end" dominant-baseline="central">Commitments + encrypted data</text>
<line x1="400" y1="398" x2="400" y2="342" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="410" y="370" text-anchor="start" dominant-baseline="central">Alerts + approvals</text>

<rect class="zone" x="30" y="400" width="620" height="210" rx="20"/>
<text class="th" x="340" y="424" text-anchor="middle" dominant-baseline="central">Permissioned blockchain (shared trust layer)</text>
<text class="ts" x="340" y="442" text-anchor="middle" dominant-baseline="central">Stores proofs, never plaintext secrets</text>
<g class="g">
<rect x="50" y="462" width="180" height="56" rx="8"/>
<text class="th" x="140" y="482" text-anchor="middle" dominant-baseline="central">OrgRegistry</text>
<text class="ts" x="140" y="500" text-anchor="middle" dominant-baseline="central">Members, roles, keys</text>
<rect x="250" y="462" width="180" height="56" rx="8"/>
<text class="th" x="340" y="482" text-anchor="middle" dominant-baseline="central">AttestationRegistry</text>
<text class="ts" x="340" y="500" text-anchor="middle" dominant-baseline="central">Shared risk proofs</text>
<rect x="450" y="462" width="180" height="56" rx="8"/>
<text class="th" x="540" y="482" text-anchor="middle" dominant-baseline="central">AlertBus</text>
<text class="ts" x="540" y="500" text-anchor="middle" dominant-baseline="central">Early-warning alerts</text>
<rect x="50" y="534" width="180" height="56" rx="8"/>
<text class="th" x="140" y="554" text-anchor="middle" dominant-baseline="central">FirmwareRegistry</text>
<text class="ts" x="140" y="572" text-anchor="middle" dominant-baseline="central">Detects fake firmware</text>
<rect x="250" y="534" width="180" height="56" rx="8"/>
<text class="th" x="340" y="554" text-anchor="middle" dominant-baseline="central">ApprovalGate</text>
<text class="ts" x="340" y="572" text-anchor="middle" dominant-baseline="central">Humans approve actions</text>
<rect x="450" y="534" width="180" height="56" rx="8"/>
<text class="th" x="540" y="554" text-anchor="middle" dominant-baseline="central">AuditLog</text>
<text class="ts" x="540" y="572" text-anchor="middle" dominant-baseline="central">Tamper-proof trail</text>
</g>

<line x1="340" y1="648" x2="340" y2="592" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="230" y="650" width="220" height="56" rx="8"/>
<text class="th" x="340" y="670" text-anchor="middle" dominant-baseline="central">Human approvers</text>
<text class="ts" x="340" y="688" text-anchor="middle" dominant-baseline="central">M-of-N + safety officer</text>
</g>
</svg>
