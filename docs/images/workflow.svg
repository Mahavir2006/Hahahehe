<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img">
<title>CascadeShield end-to-end workflow, input to output</title>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.h { font-size: 19px; font-weight: 600; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; }
.p rect { fill: #EEEDFE; stroke: #534AB7; } .p .th { fill: #3C3489; } .p .ts { fill: #534AB7; }
.g rect { fill: #E1F5EE; stroke: #0F6E56; } .g .th { fill: #085041; } .g .ts { fill: #0F6E56; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.lead { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; }
.key { font-size: 12px; fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="740" fill="#FFFFFF"/>
<text class="h" x="340" y="30" text-anchor="middle" dominant-baseline="central">End-to-end workflow: advisory in, safe action out</text>
<rect x="150" y="54" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text class="key" x="170" y="61" dominant-baseline="central">AI agent step</text>
<rect x="290" y="54" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="key" x="310" y="61" dominant-baseline="central">What goes on-chain</text>
<rect x="460" y="54" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
<text class="key" x="480" y="61" dominant-baseline="central">Input / human / output</text>

<g transform="translate(0,70)">
<rect class="box" x="60" y="20" width="350" height="50" rx="8"/>
<text class="th" x="235" y="36" text-anchor="middle" dominant-baseline="central">Input: security advisory arrives</text>
<text class="ts" x="235" y="54" text-anchor="middle" dominant-baseline="central">Messy text, may hide prompt injection</text>
<line x1="235" y1="72" x2="235" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="p">
<rect x="60" y="92" width="350" height="50" rx="8"/>
<text class="th" x="235" y="108" text-anchor="middle" dominant-baseline="central">1. Intake: extract CVEs, match assets</text>
<text class="ts" x="235" y="126" text-anchor="middle" dominant-baseline="central">Only against the org's own inventory</text>
<rect x="60" y="164" width="350" height="50" rx="8"/>
<text class="th" x="235" y="180" text-anchor="middle" dominant-baseline="central">2. Risk: ML likelihood x impact</text>
<text class="ts" x="235" y="198" text-anchor="middle" dominant-baseline="central">0-100 score + SHAP "why"</text>
<rect x="60" y="236" width="350" height="50" rx="8"/>
<text class="th" x="235" y="252" text-anchor="middle" dominant-baseline="central">3. Cascade: power, water, hospital</text>
<text class="ts" x="235" y="270" text-anchor="middle" dominant-baseline="central">Probability + time-to-impact</text>
<rect x="60" y="308" width="350" height="50" rx="8"/>
<text class="th" x="235" y="324" text-anchor="middle" dominant-baseline="central">4. Planner: patch, segment, monitor</text>
<text class="ts" x="235" y="342" text-anchor="middle" dominant-baseline="central">What-if: risk drop per fix</text>
<rect x="60" y="380" width="350" height="50" rx="8"/>
<text class="th" x="235" y="396" text-anchor="middle" dominant-baseline="central">5. Critic: independent safety check</text>
<text class="ts" x="235" y="414" text-anchor="middle" dominant-baseline="central">Rejects unsafe plans, planner retries</text>
<rect x="60" y="524" width="350" height="50" rx="8"/>
<text class="th" x="235" y="540" text-anchor="middle" dominant-baseline="central">7. Executor: apply fix (simulated)</text>
<text class="ts" x="235" y="558" text-anchor="middle" dominant-baseline="central">Re-scores: drop matches prediction</text>
</g>

<rect class="box" x="60" y="452" width="350" height="50" rx="8"/>
<text class="th" x="235" y="468" text-anchor="middle" dominant-baseline="central">6. Humans approve (not the AI)</text>
<text class="ts" x="235" y="486" text-anchor="middle" dominant-baseline="central">HIGH needs M votes + safety officer</text>
<rect class="box" x="60" y="596" width="350" height="50" rx="8"/>
<text class="th" x="235" y="612" text-anchor="middle" dominant-baseline="central">Output: dashboard for operators</text>
<text class="ts" x="235" y="630" text-anchor="middle" dominant-baseline="central">Risk, why, fixes, risk reduction</text>

<line x1="235" y1="144" x2="235" y2="162" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="216" x2="235" y2="234" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="288" x2="235" y2="306" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="360" x2="235" y2="378" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="432" x2="235" y2="450" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="504" x2="235" y2="522" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="576" x2="235" y2="594" class="arr" marker-end="url(#arrow)"/>

<line class="lead" x1="410" y1="117" x2="450" y2="117"/>
<line class="lead" x1="410" y1="189" x2="450" y2="189"/>
<line class="lead" x1="410" y1="261" x2="450" y2="261"/>
<line class="lead" x1="410" y1="405" x2="450" y2="405"/>
<line class="lead" x1="410" y1="477" x2="450" y2="477"/>
<line class="lead" x1="410" y1="549" x2="450" y2="549"/>
<g class="g">
<rect x="450" y="92" width="190" height="50" rx="8"/>
<text class="th" x="545" y="108" text-anchor="middle" dominant-baseline="central">AttestationRegistry</text>
<text class="ts" x="545" y="126" text-anchor="middle" dominant-baseline="central">Blinded finding receipt</text>
<rect x="450" y="164" width="190" height="50" rx="8"/>
<text class="th" x="545" y="180" text-anchor="middle" dominant-baseline="central">AttestationRegistry</text>
<text class="ts" x="545" y="198" text-anchor="middle" dominant-baseline="central">Encrypted risk band</text>
<rect x="450" y="236" width="190" height="50" rx="8"/>
<text class="th" x="545" y="252" text-anchor="middle" dominant-baseline="central">AlertBus</text>
<text class="ts" x="545" y="270" text-anchor="middle" dominant-baseline="central">Warns downstream orgs</text>
<rect x="450" y="380" width="190" height="50" rx="8"/>
<text class="th" x="545" y="396" text-anchor="middle" dominant-baseline="central">AuditLog</text>
<text class="ts" x="545" y="414" text-anchor="middle" dominant-baseline="central">Verdict anchored</text>
<rect x="450" y="452" width="190" height="50" rx="8"/>
<text class="th" x="545" y="468" text-anchor="middle" dominant-baseline="central">ApprovalGate</text>
<text class="ts" x="545" y="486" text-anchor="middle" dominant-baseline="central">No bypass in code</text>
<rect x="450" y="524" width="190" height="50" rx="8"/>
<text class="th" x="545" y="540" text-anchor="middle" dominant-baseline="central">AuditLog</text>
<text class="ts" x="545" y="558" text-anchor="middle" dominant-baseline="central">Execution recorded</text>
</g>
</g>
</svg>
