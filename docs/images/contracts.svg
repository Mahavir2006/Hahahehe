<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img">
<title>The six CascadeShield smart contracts and what each one does</title>
<style>
text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
.h { font-size: 19px; font-weight: 600; fill: #2C2C2A; }
.sub { font-size: 12px; fill: #5F5E5A; }
.card { fill: #E1F5EE; stroke: #0F6E56; }
.name { font-size: 15px; font-weight: 600; fill: #085041; }
.body { font-size: 12px; fill: #085041; }
.why { font-size: 12px; font-weight: 600; fill: #0F6E56; }
.rule { stroke: #5DCAA5; stroke-width: 1; }
</style>
<rect width="680" height="500" fill="#FFFFFF"/>
<text class="h" x="340" y="28" text-anchor="middle" dominant-baseline="central">Six smart contracts, one job each</text>
<text class="sub" x="340" y="50" text-anchor="middle" dominant-baseline="central">On-chain: commitments, signatures, encrypted envelopes. Never plaintext vulnerabilities.</text>

<rect class="card" x="40" y="72" width="290" height="124" rx="10"/>
<text class="name" x="58" y="96" dominant-baseline="central">OrgRegistry</text>
<text class="body" x="58" y="122" dominant-baseline="central">Who is in the consortium: each org's AI</text>
<text class="body" x="58" y="140" dominant-baseline="central">agent key, human approvers, encryption key</text>
<line class="rule" x1="58" y1="158" x2="312" y2="158"/>
<text class="why" x="58" y="177" dominant-baseline="central">Why chain: no single owner of the list</text>

<rect class="card" x="350" y="72" width="290" height="124" rx="10"/>
<text class="name" x="368" y="96" dominant-baseline="central">AttestationRegistry</text>
<text class="body" x="368" y="122" dominant-baseline="central">Dependencies both sides confirm, encrypted</text>
<text class="body" x="368" y="140" dominant-baseline="central">risk bands, blinded advisory receipts</text>
<line class="rule" x1="368" y1="158" x2="622" y2="158"/>
<text class="why" x="368" y="177" dominant-baseline="central">Why chain: one truth, lies can be challenged</text>

<rect class="card" x="40" y="212" width="290" height="124" rx="10"/>
<text class="name" x="58" y="236" dominant-baseline="central">AlertBus</text>
<text class="body" x="58" y="262" dominant-baseline="central">Early warning to orgs that depend on an</text>
<text class="body" x="58" y="280" dominant-baseline="central">at-risk service; severity stays encrypted</text>
<line class="rule" x1="58" y1="298" x2="312" y2="298"/>
<text class="why" x="58" y="317" dominant-baseline="central">Why chain: only real dependents can ack</text>

<rect class="card" x="350" y="212" width="290" height="124" rx="10"/>
<text class="name" x="368" y="236" dominant-baseline="central">ApprovalGate</text>
<text class="body" x="368" y="262" dominant-baseline="central">AI only requests; humans vote. HIGH impact</text>
<text class="body" x="368" y="280" dominant-baseline="central">needs M of N approvers + safety officer</text>
<line class="rule" x1="368" y1="298" x2="622" y2="298"/>
<text class="why" x="368" y="317" dominant-baseline="central">Why chain: the AI cannot bypass the rule</text>

<rect class="card" x="40" y="352" width="290" height="124" rx="10"/>
<text class="name" x="58" y="376" dominant-baseline="central">AuditLog</text>
<text class="body" x="58" y="402" dominant-baseline="central">Hash-chained diary of every AI decision,</text>
<text class="body" x="58" y="420" dominant-baseline="central">critic verdict and execution</text>
<line class="rule" x1="58" y1="438" x2="312" y2="438"/>
<text class="why" x="58" y="457" dominant-baseline="central">Why chain: any edit is caught exactly</text>

<rect class="card" x="350" y="352" width="290" height="124" rx="10"/>
<text class="name" x="368" y="376" dominant-baseline="central">FirmwareRegistry</text>
<text class="body" x="368" y="402" dominant-baseline="central">Vendors publish official firmware hashes;</text>
<text class="body" x="368" y="420" dominant-baseline="central">every device is checked against them</text>
<line class="rule" x1="368" y1="438" x2="622" y2="438"/>
<text class="why" x="368" y="457" dominant-baseline="central">Why chain: catches tampered firmware</text>
</svg>
